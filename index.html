<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>シフトーク</title>
  <style>
    body {
      max-width: 960px;
      margin: 32px auto;
      padding: 0 16px;
      font-family: sans-serif;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }

    caption {
      padding: 12px;
      font-size: 1.25rem;
      font-weight: bold;
    }

    th,
    td {
      height: 56px;
      padding: 8px;
      border: 1px solid #999;
      text-align: left;
      vertical-align: top;
    }

    form {
      display: grid;
      max-width: 360px;
      gap: 8px;
      margin: 24px 0;
    }

    input,
    button {
      padding: 8px;
      font: inherit;
    }
  </style>
</head>
<body>
  <header>
    <h1>シフトーク</h1>
  </header>

  <main>
    <section aria-labelledby="calendar-heading">
      <h2 id="calendar-heading">勤務カレンダー</h2>
      <table aria-label="2026年11月のシフトカレンダー">
        <caption>2026年11月</caption>
        <thead>
          <tr>
            <th scope="col">月</th>
            <th scope="col">火</th>
            <th scope="col">水</th>
            <th scope="col">木</th>
            <th scope="col">金</th>
            <th scope="col">土</th>
            <th scope="col">日</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td></td><td></td><td></td><td></td><td></td><td></td><td>1</td>
          </tr>
          <tr>
            <td>2</td><td>3</td><td>4</td><td>5</td><td>6</td><td>7</td><td>8</td>
          </tr>
          <tr>
            <td>9</td><td>10</td><td>11</td><td>12</td><td>13</td><td>14</td><td>15</td>
          </tr>
          <tr>
            <td>16</td><td>17</td><td>18</td><td>19</td><td>20</td><td>21</td><td>22</td>
          </tr>
          <tr>
            <td>23</td><td>24</td><td>25</td><td>26</td><td>27</td><td>28</td><td>29</td>
          </tr>
          <tr>
            <td>30</td><td></td><td></td><td></td><td></td><td></td><td></td>
          </tr>
        </tbody>
      </table>
    </section>

    <section aria-labelledby="form-heading">
      <h2 id="form-heading">シフトを登録</h2>
      <form>
        <label for="shift-date">勤務日</label>
        <input id="shift-date" name="date" type="date">

        <label for="shift-input">シフト内容</label>
        <input id="shift-input" name="shift" type="text" placeholder="例：早番 9:00〜17:00">

        <button id="add-button" type="button">登録する</button>
      </form>
    </section>

    <section aria-labelledby="list-heading">
      <h2 id="list-heading">登録したシフト</h2>
      <ul id="shift-list">
        <li>登録したシフトがここに並びます。</li>
      </ul>
    </section>
  </main>
</body>
</html>
