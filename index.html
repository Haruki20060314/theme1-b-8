<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>シフトーク</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>シフトーク</h1>
  </header>

  <main>

    <!-- ========================= -->
    <!-- 上部：勤務カレンダー -->
    <!-- ========================= -->
    <section id="calendar-section">

      <h2 id="calendar-heading">勤務カレンダー</h2>

      <div id="calendar-controls">
        <button id="prev-month" type="button">前月</button>
        <span id="current-month">2026年11月</span>
        <button id="next-month" type="button">次月</button>
      </div>

      <table aria-label="勤務カレンダー">
        <thead>
          <tr>
            <th>月</th>
            <th>火</th>
            <th>水</th>
            <th>木</th>
            <th>金</th>
            <th>土</th>
            <th>日</th>
          </tr>
        </thead>

        <tbody>
          <tr>
            <td></td>
            <td></td>
            <td></td>
            <td></td>
            <td></td>
            <td></td>
            <td>
              <button class="date-shift">1</button>
            </td>
          </tr>

          <tr>
            <td><button class="date-shift">2</button></td>
            <td><button class="date-shift">3</button></td>
            <td><button class="date-shift">4</button></td>
            <td><button class="date-shift">5</button></td>
            <td><button class="date-shift">6</button></td>
            <td><button class="date-shift">7</button></td>
            <td><button class="date-shift">8</button></td>
          </tr>

          <tr>
            <td><button class="date-shift">9</button></td>
            <td><button class="date-shift">10</button></td>
            <td><button class="date-shift">11</button></td>
            <td><button class="date-shift">12</button></td>
            <td><button class="date-shift">13</button></td>
            <td><button class="date-shift">14</button></td>
            <td><button class="date-shift">15</button></td>
          </tr>

          <tr>
            <td><button class="date-shift">16</button></td>
            <td><button class="date-shift">17</button></td>
            <td><button class="date-shift">18</button></td>
            <td><button class="date-shift">19</button></td>
            <td><button class="date-shift">20</button></td>
            <td><button class="date-shift">21</button></td>
            <td><button class="date-shift">22</button></td>
          </tr>

          <tr>
            <td><button class="date-shift">23</button></td>
            <td><button class="date-shift">24</button></td>
            <td><button class="date-shift">25</button></td>
            <td><button class="date-shift">26</button></td>
            <td><button class="date-shift">27</button></td>
            <td><button class="date-shift">28</button></td>
            <td><button class="date-shift">29</button></td>
          </tr>

          <tr>
            <td><button class="date-shift">30</button></td>
            <td></td>
            <td></td>
            <td></td>
            <td></td>
            <td></td>
            <td></td>
          </tr>
        </tbody>
      </table>

    </section>

    <!-- ========================= -->
    <!-- 中央：シフト登録・自分のシフト -->
    <!-- ========================= -->
    <section id="middle-section">

      <!-- 左 -->
      <div id="shift-input">

        <h2>シフト登録</h2>

        <form>

          <label for="shift-date">
            勤務日
          </label>

          <input
            type="date"
            id="shift-date"
            name="date"
          >

          <label for="start-time">
            開始時間
          </label>

          <select id="start-time">
            <option value="">選択してください</option>
          </select>

          <label for="end-time">
            終了時間
          </label>

          <select id="end-time">
            <option value="">選択してください</option>
          </select>

          <button
            id="add-button"
            type="button"
          >
            登録する
          </button>

        </form>

      </div>

      <!-- 右 -->
      <div id="my-shift-section">

        <h2>自分のシフト一覧</h2>

        <ul id="shift-list">
          <li>登録したシフトがここに並びます。</li>
        </ul>

      </div>

    </section>

    <!-- ========================= -->
    <!-- 下部：みんなのシフト・メッセージ -->
    <!-- ========================= -->
    <section id="bottom-section">

      <!-- 左 -->
      <div id="all-shift-section">

        <h2>みんなのシフト</h2>

        <p id="selected-date">
          カレンダーの日付を選択してください
        </p>

        <div id="all-shift-list">

          <div class="employee-row">
            <span class="employee-name">山田</span>
            <div class="shift-bar">
              シフト表示エリア
            </div>
          </div>

          <div class="employee-row">
            <span class="employee-name">田中</span>
            <div class="shift-bar">
              シフト表示エリア
            </div>
          </div>

          <div class="employee-row">
            <span class="employee-name">鈴木</span>
            <div class="shift-bar">
              シフト表示エリア
            </div>
          </div>

        </div>

      </div>

      <!-- 右 -->
      <div id="message-section">

        <h2>メッセージ</h2>

        <div id="message-list">

          <div class="message-item">

            <div class="message-name">
              山田
            </div>

            <div class="message-datetime">
              2026/11/25 09:00
            </div>

            <div class="message-text">
              メッセージがここに表示されます。
            </div>

          </div>

        </div>

        <textarea
          id="message-input"
          placeholder="メッセージを入力してください"
        ></textarea>

        <button
          id="send-message"
          type="button"
        >
          送信
        </button>

      </div>

    </section>

  </main>

  <script src="app.js"></script>

</body>
</html>
